name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: 1. Quality Gates (Lint & Test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run ESLint
        run: npm run lint
      - name: Run Unit Tests
        run: npm test

  build:
    name: 2. Container Build & Smoke Test
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker Image
        run: docker build --build-arg GIT_SHA=${{ github.sha }} -t leaderboard-app .
      - name: Container Smoke Test
        run: |
          docker run -d -p 5000:5000 leaderboard-app
          sleep 5
          curl -f http://localhost:5000/health

  deploy:
    name: 3. Trigger Render Deployment
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Send Deploy Trigger
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}&ref=${{ github.sha }}"